
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:#f4f0ff;color:#1a1a2e;direction:rtl;font-size:13px}
.hdr{background:linear-gradient(135deg,#3d0066,#7B2FBE);padding:18px 18px 14px;border-radius:0 0 16px 16px;margin-bottom:14px}
.hdr-title{color:#FFD700;font-size:11px;font-weight:700;margin-bottom:2px}
.hdr-main{color:#fff;font-size:18px;font-weight:800}
.hdr-sub{color:#c9a0f5;font-size:11px;margin-top:1px}
.sel{padding:5px 10px;border-radius:10px;border:1.5px solid #c9a0f5;background:rgba(255,255,255,0.13);color:#fff;font-family:'Cairo',sans-serif;font-size:11px;cursor:pointer}
.cards-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.mcard{background:rgba(255,255,255,0.1);border-radius:10px;padding:9px 11px;border:1px solid rgba(255,255,255,0.2)}
.mcard.top{background:rgba(255,215,0,0.18);border:1.5px solid #FFD700}
.top-badge{background:#FFD700;color:#4B0082;font-size:9px;font-weight:800;padding:1px 7px;border-radius:7px;display:inline-block;margin-bottom:3px}
.mcard-name{color:#fff;font-weight:700;font-size:12px}
.mcard-score{color:#fff;font-size:22px;font-weight:800;line-height:1.1}
.mcard-score span{font-size:10px;color:#c9a0f5;font-weight:400}
.bar{height:4px;background:rgba(255,255,255,0.15);border-radius:3px;margin-top:5px;overflow:hidden}
.bar-fill{height:100%;background:#c9a0f5;border-radius:3px;transition:width .6s}
.mcard.top .bar-fill{background:#FFD700}

.tabs{display:flex;gap:6px;padding:0 14px;margin-bottom:10px}
.tab{padding:6px 14px;border-radius:16px;border:1.5px solid #c9a0f5;background:transparent;font-family:'Cairo',sans-serif;font-size:11px;cursor:pointer;color:#7B2FBE;font-weight:700;transition:all .15s}
.tab.active{background:#4B0082;color:#fff;border-color:#4B0082}

.body{padding:0 14px 20px}

/* AI Input Section */
.ai-section{background:#fff;border:1px solid #e0d0f5;border-radius:12px;padding:14px;margin-bottom:12px}
.ai-sec-title{color:#4B0082;font-weight:800;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.member-input-block{margin-bottom:10px}
.member-label{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.avatar{width:26px;height:26px;border-radius:50%;background:#F0E6FF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#4B0082;flex-shrink:0}
.member-name-lbl{font-weight:700;font-size:12px;color:#2d1b4e}
.member-en-lbl{font-size:10px;color:#aaa}
textarea{width:100%;border:1px solid #e0d0f5;border-radius:8px;padding:8px 10px;font-family:'Cairo',sans-serif;font-size:12px;color:#333;resize:vertical;min-height:60px;background:#fafafa;transition:border .2s;line-height:1.6}
textarea:focus{outline:none;border-color:#7B2FBE;background:#fff}
textarea::placeholder{color:#bbb}
.ai-btn{width:100%;padding:10px;background:linear-gradient(135deg,#4B0082,#7B2FBE);color:#fff;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.ai-btn:hover{opacity:.88}
.ai-btn:disabled{opacity:.5;cursor:not-allowed}
.ai-status{text-align:center;color:#7B2FBE;font-size:12px;font-weight:600;padding:6px 0;display:none}
.loading-dots span{animation:blink 1.2s infinite;display:inline-block}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* Scorecard Table */
.section-hdr{background:#7B2FBE;color:#fff;padding:7px 12px;border-radius:8px 8px 0 0;font-size:11px;font-weight:700}
.kpi-table{border:1px solid #e0d0f5;border-top:none;border-radius:0 0 8px 8px;overflow:hidden;margin-bottom:10px}
.kpi-row-hdr{display:grid;grid-template-columns:1fr 62px 62px 62px;background:#F0E6FF;padding:6px 10px;font-size:10px;font-weight:700;color:#4B0082;gap:4px;align-items:center}
.kpi-row{display:grid;grid-template-columns:1fr 62px 62px 62px;padding:7px 10px;gap:4px;align-items:center;border-top:1px solid #f0e6ff;transition:background .15s}
.kpi-row:hover{background:#faf5ff}
.kpi-row:nth-child(even){background:#fafafa}
.kpi-row:nth-child(even):hover{background:#faf5ff}
.kpi-ar{font-weight:600;font-size:11px;color:#2d1b4e}
.kpi-en{font-size:9px;color:#aaa}
.kpi-w{font-size:9px;color:#b39ddb}
.score-cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.si{width:44px;height:28px;border:1.5px solid #c9a0f5;border-radius:6px;text-align:center;font-size:13px;font-weight:700;font-family:'Cairo',sans-serif;outline:none;transition:all .2s;background:#fff;color:#4B0082}
.si:focus{border-color:#7B2FBE;box-shadow:0 0 0 2px #e8d5ff}
.slabel{font-size:8px;font-weight:700;line-height:1}
.total-row{background:#4B0082;display:grid;grid-template-columns:1fr 62px 62px 62px;padding:9px 10px;gap:4px;align-items:center;border-top:2px solid #7B2FBE}
.total-name{color:#C9A0F5;font-weight:700;font-size:11px}
.total-val{text-align:center;color:#fff;font-size:18px;font-weight:800}
.total-val.top-val{color:#FFD700}

/* Reasoning */
.reasoning-section{background:#fff;border:1px solid #e0d0f5;border-radius:10px;overflow:hidden;margin-bottom:10px}
.reasoning-hdr{background:#F0E6FF;padding:8px 12px;font-size:11px;font-weight:700;color:#4B0082;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.reasoning-body{padding:10px 12px;display:none}
.reason-item{margin-bottom:8px;border-bottom:1px solid #f0e6ff;padding-bottom:8px}
.reason-item:last-child{border:none;margin:0;padding:0}
.reason-member{font-weight:700;font-size:11px;color:#7B2FBE;margin-bottom:3px}
.reason-text{font-size:11px;color:#555;line-height:1.7}

/* Tracker */
.track-table{border:1px solid #e0d0f5;border-radius:10px;overflow:hidden}
.track-hdr-row{background:#4B0082;display:grid;padding:8px 12px;gap:6px;font-size:11px;font-weight:700;color:#C9A0F5}
.track-data-row{display:grid;padding:8px 12px;gap:6px;border-top:1px solid #f0e6ff;align-items:center}
.empty-state{text-align:center;padding:32px 0;color:#aaa}

/* legend */
.legend{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.lchip{padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700}
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px">
    <div>
      <div class="hdr-title">✨ AI-Powered · Marketing & Media</div>
      <div class="hdr-main">داش بورد أداء الفريق الذكي</div>
      <div class="hdr-sub">بيقيّم الأداء أوتوماتيك بالذكاء الاصطناعي — ميرنا | Team Lead</div>
    </div>
    <div style="display:flex;gap:5px;align-items:center">
      <select class="sel" id="monthSel"></select>
      <select class="sel" id="yearSel"><option>2024</option><option selected>2025</option><option>2026</option></select>
    </div>
  </div>
  <div class="cards-row" id="memberCards"></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('ai',this)">🤖 تقييم ذكي</button>
  <button class="tab" onclick="switchTab('scorecard',this)">📊 Scorecard</button>
  <button class="tab" onclick="switchTab('tracker',this)">📅 السجل</button>
</div>

<div class="body" id="mainBody"></div>

<script>
const MEMBERS=["ملك","مريم","إسراء"];
const MEMBER_EN=["Malak","Mariam","Israa"];
const AV=["م","ر","إ"];
const MONTHS_AR=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const KPIS=[
  {id:1,group:"💡 الأفكار والإبداع",ar:"أفكار جديدة",en:"New Ideas",w:15},
  {id:2,group:"💡 الأفكار والإبداع",ar:"إبداع المحتوى",en:"Content & Creativity",w:15},
  {id:3,group:"📣 المسؤولية والحملات",ar:"تحمّل المسؤولية",en:"Campaign Ownership",w:10},
  {id:4,group:"📣 المسؤولية والحملات",ar:"حل المشاكل",en:"Problem Solving",w:10},
  {id:5,group:"⚖️ الثبات والتطوير",ar:"ثبات الأداء",en:"Stability",w:10},
  {id:6,group:"⚖️ الثبات والتطوير",ar:"التعلم والتجديد",en:"Learning",w:10},
  {id:7,group:"🤝 الاحترافية والتيم",ar:"العمل الجماعي",en:"Teamwork",w:10},
  {id:8,group:"🤝 الاحترافية والتيم",ar:"التواصل والاستجابة",en:"Communication",w:10},
  {id:9,group:"🤝 الاحترافية والتيم",ar:"الالتزام والسلوك",en:"Commitment",w:10},
];
const GROUPS=[...new Set(KPIS.map(k=>k.group))];
const SK="mirna_ai_dash_v2";

let scores={},history={},reasoning={};
let curTab="ai";

try{const d=JSON.parse(localStorage.getItem(SK)||"{}");scores=d.scores||{};history=d.history||{};reasoning=d.reasoning||{};}catch{}
function persist(){try{localStorage.setItem(SK,JSON.stringify({scores,history,reasoning}));}catch{}}

const monthSel=document.getElementById("monthSel");
MONTHS_AR.forEach((m,i)=>{const o=document.createElement("option");o.value=i;o.textContent=m;if(i===new Date().getMonth())o.selected=true;monthSel.appendChild(o);});

function getScore(kId,m){return Number(scores[kId]?.[m]||0);}
function getTotal(m){return KPIS.reduce((s,k)=>s+getScore(k.id,m),0);}
function topIdx(){const ts=MEMBERS.map(m=>getTotal(m));const mx=Math.max(...ts);return mx>0?ts.indexOf(mx):-1;}

function scColor(v){
  if(!v)return{bg:"#f5f5f5",tc:"#bbb",lbl:"—"};
  if(v>=9)return{bg:"#D5F5E3",tc:"#1a7a4a",lbl:"ممتاز"};
  if(v>=7)return{bg:"#D6EAF8",tc:"#1a5276",lbl:"جيد جداً"};
  if(v>=5)return{bg:"#FDEBD0",tc:"#a04000",lbl:"جيد"};
  if(v>=3)return{bg:"#FDEDEC",tc:"#922b21",lbl:"يحتاج تطوير"};
  return{bg:"#FADBD8",tc:"#7b241c",lbl:"ضعيف"};
}

function renderCards(){
  const top=topIdx();
  document.getElementById("memberCards").innerHTML=MEMBERS.map((m,i)=>{
    const t=getTotal(m);const isTop=i===top&&t>0;
    return`<div class="mcard${isTop?" top":""}">
      ${isTop?'<div class="top-badge">🏅 نجمة الشهر</div>':''}
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">
        <div class="avatar" style="background:${isTop?"#FFD700":"#c9a0f5"}">${AV[i]}</div>
        <div><div class="mcard-name">${m}</div><div style="color:#c9a0f5;font-size:9px">${MEMBER_EN[i]}</div></div>
      </div>
      <div class="mcard-score">${t}<span>/90</span></div>
      <div class="bar"><div class="bar-fill" style="width:${Math.round((t/90)*100)}%"></div></div>
    </div>`;
  }).join("");
}

/* ─── AI EVALUATION ─── */
async function runAI(){
  const descs={};
  let hasContent=false;
  MEMBERS.forEach((m,i)=>{
    const v=document.getElementById(`desc_${i}`)?.value?.trim();
    descs[m]=v||"";
    if(v)hasContent=true;
  });
  if(!hasContent){alert("اكتبي وصف لأداء واحدة على الأقل!");return;}

  const btn=document.getElementById("aiBtn");
  const status=document.getElementById("aiStatus");
  btn.disabled=true;
  status.style.display="block";
  status.innerHTML='<span class="loading-dots">🤖 Claude بيحلل الأداء<span>.</span><span>.</span><span>.</span></span>';

  const kpiList=KPIS.map(k=>`${k.id}. ${k.ar} (${k.en}) — Weight: ${k.w}%`).join("\n");
  const memberDescs=MEMBERS.map((m,i)=>`=== ${m} (${MEMBER_EN[i]}) ===\n${descs[m]||"لم يُذكر أداء"}`).join("\n\n");

  const prompt=`أنتِ مديرة HR خبيرة في شركة Marketing & Media متخصصة في تسجيل كباتن Uber/DiDi/inDrive في مصر والسعودية والجزائر والمغرب ونيجيريا.

قيّمي أداء هؤلاء الموظفين الثلاثة بناءً على الوصف المقدم:

${memberDescs}

معايير التقييم (كل معيار من 10):
${kpiList}

أعطي درجة دقيقة من 1-10 لكل معيار لكل موظفة بناءً على الوصف فقط. إذا لم يُذكر معيار معين، أعطِ 5 كدرجة محايدة.

رد بـ JSON فقط بهذا الشكل بالضبط:
{
  "scores": {
    "ملك": {"1":8,"2":7,"3":9,"4":6,"5":8,"6":7,"7":9,"8":8,"9":9},
    "مريم": {"1":7,"2":8,"3":7,"4":8,"5":7,"6":8,"7":7,"8":7,"9":8},
    "إسراء": {"1":6,"2":7,"3":6,"4":7,"5":6,"6":7,"7":6,"8":7,"9":6}
  },
  "reasoning": {
    "ملك": "تقييم موجز جداً باللغة العربية في جملتين",
    "مريم": "تقييم موجز باللغة العربية في جملتين",
    "إسراء": "تقييم موجز باللغة العربية في جملتين"
  }
}`;

  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        messages:[{role:"user",content:prompt}]
      })
    });
    const data=await res.json();
    const text=data.content?.find(c=>c.type==="text")?.text||"";
    const jsonMatch=text.match(/\{[\s\S]*\}/);
    if(!jsonMatch)throw new Error("no json");
    const parsed=JSON.parse(jsonMatch[0]);

    // Apply scores
    MEMBERS.forEach(m=>{
      KPIS.forEach(k=>{
        const v=parsed.scores?.[m]?.[k.id];
        if(v!==undefined){
          if(!scores[k.id])scores[k.id]={};
          scores[k.id][m]=Math.min(10,Math.max(1,Number(v)));
        }
      });
    });
    reasoning=parsed.reasoning||{};
    persist();
    renderCards();
    status.style.display="none";
    btn.disabled=false;
    // Show success + reasoning
    document.getElementById("resultBox").style.display="block";
    document.getElementById("reasoningContent").innerHTML=MEMBERS.map(m=>`
      <div class="reason-item">
        <div class="reason-member">${m} — ${MEMBER_EN[MEMBERS.indexOf(m)]}</div>
        <div class="reason-text">${reasoning[m]||"—"}</div>
      </div>`).join("");
    // Switch to scorecard to show results
    setTimeout(()=>{
      document.querySelectorAll(".tab").forEach((t,i)=>{t.classList.remove("active");if(i===1)t.classList.add("active");});
      curTab="scorecard";renderBody();
    },1800);
  }catch(e){
    status.style.display="none";
    btn.disabled=false;
    status.style.display="block";
    status.innerHTML="❌ حصل خطأ، حاولي تاني";
    status.style.color="#922b21";
    setTimeout(()=>{status.style.display="none";status.style.color="#7B2FBE";},3000);
  }
}

/* ─── RENDER TABS ─── */
function renderAI(){
  let html=`<div class="ai-section">
    <div class="ai-sec-title">🤖 اكتبي أداء كل عضوة وClaude هيقيّمهم أوتوماتيك</div>
    ${MEMBERS.map((m,i)=>`
    <div class="member-input-block">
      <div class="member-label">
        <div class="avatar">${AV[i]}</div>
        <div class="member-name-lbl">${m}</div>
        <div class="member-en-lbl">${MEMBER_EN[i]}</div>
      </div>
      <textarea id="desc_${i}" placeholder="مثال: ملك الشهر ده جابت 3 أفكار حملات جديدة لأوبر مصر، حلّت مشكلة في نظام التسجيل بسرعة، وكانت ملتزمة في مواعيدها وشغلها..."></textarea>
    </div>`).join("")}
    <button class="ai-btn" id="aiBtn" onclick="runAI()">
      ✨ قيّم الفريق أوتوماتيك
    </button>
    <div class="ai-status" id="aiStatus"></div>
  </div>`;

  // Show reasoning if exists
  const hasReasoning=Object.keys(reasoning).length>0;
  if(hasReasoning){
    html+=`<div class="reasoning-section" id="resultBox">
      <div class="reasoning-hdr" onclick="toggleReasoning()">
        💬 تحليل Claude للأداء <span id="reasonToggle">▼</span>
      </div>
      <div class="reasoning-body" id="reasoningContent" style="display:block">
        ${MEMBERS.map(m=>`<div class="reason-item">
          <div class="reason-member">${m} — ${MEMBER_EN[MEMBERS.indexOf(m)]}</div>
          <div class="reason-text">${reasoning[m]||"—"}</div>
        </div>`).join("")}
      </div>
    </div>`;
  } else {
    html+=`<div id="resultBox" style="display:none"><div class="reasoning-section">
      <div class="reasoning-hdr">💬 تحليل Claude للأداء</div>
      <div class="reasoning-body" id="reasoningContent" style="display:block"></div>
    </div></div>`;
  }

  // legend
  html+=`<div class="legend">
    <span class="lchip" style="background:#D5F5E3;color:#1a7a4a">9-10 ممتاز</span>
    <span class="lchip" style="background:#D6EAF8;color:#1a5276">7-8 جيد جداً</span>
    <span class="lchip" style="background:#FDEBD0;color:#a04000">5-6 جيد</span>
    <span class="lchip" style="background:#FDEDEC;color:#922b21">3-4 يحتاج</span>
    <span class="lchip" style="background:#FADBD8;color:#7b241c">1-2 ضعيف</span>
  </div>`;

  document.getElementById("mainBody").innerHTML=html;
}

function toggleReasoning(){
  const el=document.getElementById("reasoningContent");
  const tog=document.getElementById("reasonToggle");
  if(el.style.display==="none"){el.style.display="block";tog.textContent="▼";}
  else{el.style.display="none";tog.textContent="◀";}
}

function renderScorecard(){
  const top=topIdx();
  const totals=MEMBERS.map(m=>getTotal(m));
  let html=GROUPS.map(g=>{
    const kpis=KPIS.filter(k=>k.group===g);
    return`<div class="section-hdr">${g}</div>
    <div class="kpi-table">
      <div class="kpi-row-hdr">
        <div>المعيار | KPI</div>
        ${MEMBERS.map((m,i)=>`<div style="text-align:center">${m}<br><span style="color:#aaa;font-weight:400;font-size:9px">${MEMBER_EN[i]}</span></div>`).join("")}
      </div>
      ${kpis.map(k=>`<div class="kpi-row">
        <div><div class="kpi-ar">${k.ar}</div><div class="kpi-en">${k.en} · ${k.w}%</div></div>
        ${MEMBERS.map(m=>{const v=getScore(k.id,m);const c=scColor(v);
          return`<div class="score-cell">
            <input type="number" min="0" max="10" value="${v||""}" class="si"
              style="${v?`background:${c.bg};color:${c.tc};border-color:${c.tc}`:""}"
              oninput="setScoreManual(${k.id},'${m}',this.value)">
            <span class="slabel" style="color:${v?c.tc:"#ccc"}">${v?c.lbl:"—"}</span>
          </div>`;}).join("")}
      </div>`).join("")}
      <div class="total-row">
        <div class="total-name">🏆 المجموع الكلي</div>
        ${MEMBERS.map((m,i)=>{const t=totals[i];const isTop=i===top&&t>0;
          return`<div class="total-val${isTop?" top-val":""}">${t}${isTop?" 🏅":""}</div>`;}).join("")}
      </div>
    </div>`;
  }).join("");

  html+=`<button style="width:100%;padding:9px;background:#4B0082;color:#fff;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer;margin-top:4px" onclick="saveMonth()">💾 حفظ ${MONTHS_AR[monthSel.value]} ${document.getElementById("yearSel").value}</button>`;
  html+=`<div id="saveMsg" style="text-align:center;color:#1a7a4a;font-weight:700;font-size:12px;padding:6px;display:none">✅ تم الحفظ!</div>`;
  document.getElementById("mainBody").innerHTML=html;
}

function setScoreManual(kId,m,val){
  const v=Math.min(10,Math.max(0,Number(val)||0));
  if(!scores[kId])scores[kId]={};
  scores[kId][m]=v;persist();renderCards();
}

function saveMonth(){
  const key=`${document.getElementById("yearSel").value}-${String(Number(monthSel.value)+1).padStart(2,"0")}`;
  if(!history[key])history[key]={};
  MEMBERS.forEach(m=>{history[key][m]=getTotal(m);});
  history[key]._month=MONTHS_AR[monthSel.value];
  history[key]._year=document.getElementById("yearSel").value;
  persist();
  const msg=document.getElementById("saveMsg");
  if(msg){msg.style.display="block";setTimeout(()=>msg.style.display="none",2000);}
}

function renderTracker(){
  const keys=Object.keys(history).sort();
  if(!keys.length){
    document.getElementById("mainBody").innerHTML=`<div class="empty-state"><div style="font-size:32px;margin-bottom:8px">📅</div><div style="font-size:13px;font-weight:600;color:#555">لا يوجد سجل بعد</div><div style="font-size:11px;margin-top:4px">قيّمي الفريق واحفظي الشهر أولاً</div></div>`;
    return;
  }
  const cols=`110px ${"1fr ".repeat(MEMBERS.length)}`;
  let html=`<div class="track-table">
    <div class="track-hdr-row" style="grid-template-columns:${cols}">
      <div>الشهر</div>${MEMBERS.map((m,i)=>`<div style="text-align:center">${m} (${MEMBER_EN[i]})</div>`).join("")}
    </div>`;
  keys.forEach((key,idx)=>{
    const e=history[key];
    const vs=MEMBERS.map(m=>e[m]||0);
    const mx=Math.max(...vs);
    html+=`<div class="track-data-row" style="grid-template-columns:${cols};background:${idx%2===0?"#fff":"#fafafa"}">
      <div style="font-weight:700;font-size:11px;color:#4B0082">${e._month||key} ${e._year||""}</div>
      ${MEMBERS.map((m,i)=>{const v=vs[i];const isTop=v===mx&&v>0;
        return`<div style="text-align:center"><span style="background:${isTop?"#FFF8DC":"#F0E6FF"};color:${isTop?"#8B6914":"#4B0082"};border:${isTop?"1px solid #FFD700":"none"};padding:2px 9px;border-radius:6px;font-weight:700;font-size:12px">${v}${isTop?" 🏅":""}</span></div>`;
      }).join("")}
    </div>`;
  });
  html+="</div>";
  document.getElementById("mainBody").innerHTML=html;
}

function switchTab(tab,el){
  curTab=tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  renderBody();
}

function renderBody(){
  if(curTab==="ai")renderAI();
  else if(curTab==="scorecard")renderScorecard();
  else renderTracker();
}

monthSel.addEventListener("change",()=>{if(curTab==="scorecard")renderScorecard();});
renderCards();
renderBody();
</script>
</body>
</html>
