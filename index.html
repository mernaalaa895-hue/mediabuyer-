
<!-- مكتبات Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<script>
// الصقي الكود الذي نسختيه من الخطوة رقم 1 هنا
const firebaseConfig = {
  apiKey: "ضعي_الـ_apiKey_الخاص_بكِ",
  databaseURL: "ضعي_رابط_قاعدة_البيانات_هنا", // ستجدينه في صفحة Realtime Database
  projectId: "mediabuyer-cc7d0"
};

// تشغيل النظام
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// وظيفة الحفظ السحابي
function persist() {
    const data = { scores, history, reasoning };
    localStorage.setItem("mirna_data", JSON.stringify(data));
    db.ref('team_performance').set(data); // إرسال لـ Firebase
}

// وظيفة جلب البيانات عند فتح الصفحة
function loadData() {
    db.ref('team_performance').on('value', (snapshot) => {
        const cloudData = snapshot.val();
        if (cloudData) {
            scores = cloudData.scores || {};
            history = cloudData.history || {};
            reasoning = cloudData.reasoning || {};
            renderCards();
            renderScorecard(); // تحديث الجدول فوراً
        }
    });
}

loadData(); // ابدأ بجلب البيانات فور فتح الصفحة
</script>
</body>
</html>
